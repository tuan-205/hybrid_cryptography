[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-cod-demo"
version = "0.1.0"
description = "Mo phong bao ve phien doi soat COD"
requires-python = ">=3.10"
dependencies = ["cryptography>=41"]

[project.scripts]
cod-demo = "hybrid_crypto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
